# Пример безопасной конфигурации anonym CLI (без реальных секретов).
# Рабочая практика:
# 1) скопируйте этот файл в config.yaml;
# 2) заполните своими значениями;
# 3) не коммитьте config.yaml.

profile: "pilot"

paths:
  # Исходные файлы для сканирования (обычно вне workspace IDE).
  raw_path: "C:/projects/sample-raw"
  # Корень рабочего проекта в IDE.
  workspace_path: "C:/projects/sample-workspace"
  # Папка для результатов анонимизации (внутри workspace).
  output_path: "C:/projects/sample-workspace/clean_inbox"

api:
  # Базовый URL API.
  base_url: "https://production-retrievals.ai.rarus-cloud.ru"
  # UUID партнера, выданный командой API.
  partner_id: "00000000-0000-0000-0000-000000000000"
  # Для mvp-режима: короткоживущий session token.
  auth_token: "<mvp-session-token>"
  # Опциональный user-id (UUID) для doctor/run.
  user_id: "00000000-0000-0000-0000-000000000000"
  # Параметры пагинации doctor (GET /v1/tasks/anonymization_fields).
  fields_page: 1
  fields_per_page: 10

limits:
  max_file_size_mb: 25
  max_pages: 300
  request_timeout_sec: 120
  max_parallel_runs: 1

security:
  allowed_hosts:
    - "production-retrievals.ai.rarus-cloud.ru"
  require_tls_verify: true

audit:
  retention_days: 30
  hmac_key_id: "audit-hmac-v1"
  # Для mvp-режима: секрет HMAC-аудита (base64 или строка).
  hmac_secret: "<mvp-audit-hmac-secret>"

runtime:
  # prod (по умолчанию) | mvp
  mode: "mvp"

logging:
  level: "info"    # debug | info | warn | error
  format: "json"   # json | console
