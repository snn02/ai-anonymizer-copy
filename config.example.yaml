# Пример конфигурации anonym CLI.
# Для режима prod секреты берутся из OS secret store.
# Для режима mvp допустимы временные секреты в config/env.

profile: pilot

paths:
  # raw_path должен быть ВНЕ workspace IDE.
  raw_path: "C:/!_D/projects/90-tests/anonym-test/raw_presale_1"
  # workspace_path — корень рабочего проекта в IDE.
  workspace_path: "C:/!_D/projects/90-tests/anonym-test/anon-presale_1"
  # output_path должен быть ВНУТРИ workspace IDE.
  output_path: "C:/!_D/projects/90-tests/anonym-test/anon-presale_1/clean_inbox"

api:
  base_url: "https://production-retrievals.ai.rarus-cloud.ru"
  partner_id: "da315a9a-b39c-11ef-a107-4cd98f59d07b"
  # Для mvp: короткоживущий session token (1-8 часов).
  auth_token: "898e0d77-80db-457e-9ebc-702b084bdb3d"
  # user-id для preflight doctor (header user-id), UUID
  user_id: "70bd3a91-1abf-11f0-a10b-f8f21e2fd431"
  # параметры пагинации для GET /v1/tasks/anonymization_fields в doctor
  fields_page: 1
  fields_per_page: 10

limits:
  max_file_size_mb: 25
  max_pages: 300
  request_timeout_sec: 5
  # Для v1 оставляем 1 по требованиям безопасности/устойчивости.
  max_parallel_runs: 1

security:
  allowed_hosts:
    - "production-retrievals.ai.rarus-cloud.ru"
  require_tls_verify: true

audit:
  retention_days: 30
  hmac_key_id: "audit-hmac-v1"
  # Для mvp: секрет для HMAC-аудита (base64 или строка).
  hmac_secret: "rSQkEsTAvbsAscSTDJW4VsAD1LfGUQ7/VNszr6nfXVM="

runtime:
  # prod (default) | mvp
  mode: "mvp"

logging:
  level: "info"    # debug | info | warn | error
  format: "json"   # json | console
